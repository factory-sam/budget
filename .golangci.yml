run:
  timeout: 5m

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Formatting
    - gofmt
    - goimports
    # Style & naming
    - revive
    - stylecheck
    # Complexity
    - gocyclo
    - cyclop
    - funlen
    - nestif
    # Dead code & unused
    - unconvert
    - unparam
    # Duplicate code
    - dupl
    # Bug detection
    - bodyclose
    - errchkjson
    - gosec
    - goconst
    - prealloc
    # Tech debt
    - godox

linters-settings:
  gocyclo:
    min-complexity: 20
  cyclop:
    max-complexity: 25
  funlen:
    lines: 150
    statements: 80
  nestif:
    min-complexity: 8
  dupl:
    threshold: 300
  revive:
    rules:
      - name: exported
        disabled: true
      - name: var-naming
        severity: warning
      - name: unexported-return
        disabled: true
  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1020"]
  godox:
    keywords:
      - TODO
      - FIXME
      - HACK
      - BUG
  errcheck:
    exclude-functions:
      - (*database/sql.Tx).Rollback
      - (*database/sql.Rows).Close
      - io.Copy
    check-type-assertions: false
  goconst:
    min-len: 3
    min-occurrences: 3

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - dupl
        - gosec
    - path: cmd/
      linters:
        - funlen
    - path: tui/
      linters:
        - funlen
        - cyclop
        - gocyclo
